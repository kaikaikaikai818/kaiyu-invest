<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaiyu Invest</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>📈 Kaiyu Invest</h1>

<p id="date"></p>


<div class="card">

<h2>💰 我的账户</h2>


<div class="row">

生活账户

<input id="life" type="number">

</div>


<div class="row">

投资账户

<input id="invest" type="number">

</div>


<div class="row">

机会账户

<input id="chance" type="number">

</div>


<div class="row">

备用金目标

<input id="reserveTarget" type="number" value="12000">

</div>


<div class="row">

当前备用金

<input id="reserve" type="number">

</div>


<button onclick="saveAccount()">

保存账户

</button>


</div>





<div class="card">


<h2>📊 市场估值</h2>


<div id="market"></div>


</div>





<div class="card">


<h2>⭐ 添加资产</h2>


<input id="assetName" placeholder="资产名称">


<input id="assetPE"
placeholder="当前PE"
type="number">


<input id="assetLow"
placeholder="低估PE"
type="number">


<input id="assetHigh"
placeholder="高估PE"
type="number">



<button onclick="addAsset()">

添加

</button>



<div id="assets"></div>


</div>




<script src="app.js"></script>


</body>

</html>
