<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaiyu">

<title>Kaiyu Invest</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>
📈 Kaiyu Invest
</h1>



<nav>

<button onclick="showPage('home')">
🏠账户
</button>


<button onclick="showPage('valuation')">
📊估值
</button>


</nav>





<!-- 首页 -->

<div id="home" class="page">


<h2>
💰账户
</h2>


<div id="accounts"></div>


<button onclick="addAccount()">

+ 添加账户

</button>



<hr>


<h2>
🛡备用金
</h2>


<div class="card">


目标：

<input 
id="reserveTarget"
type="number"
value="12000">


<br>


当前：

<input 
id="reserveNow"
type="number"
value="0">



<button onclick="saveReserve()">

保存

</button>


</div>



</div>







<!--估值页面-->

<div id="valuation" class="page hidden">


<h2>
📊市场估值
</h2>



<div class="card">


更新时间：

<span id="updateTime">
未更新
</span>


<br>


<button onclick="refreshData()">

刷新

</button>


</div>




<div id="markets"></div>



<button onclick="openAdd()">

+ 添加估值

</button>



</div>







<!-- 添加估值弹窗 -->


<div id="addBox" class="card hidden">


<h3>
添加估值
</h3>


名称：

<br>

<input id="nameInput">



<br>


类型：

<br>


<select id="typeInput">


<option value="PE">
PE
</option>


<option value="PRICE">
价格
</option>


</select>




<br>


当前值：

<br>

<input id="valueInput"
type="number">



<br>


低估线：

<br>

<input id="lowInput"
type="number">



<br>


高估线：

<br>

<input id="highInput"
type="number">



<br>


<button onclick="addMarket()">

保存

</button>



<button onclick="closeAdd()">

取消

</button>


</div>







<script src="data.js?v=7.2"></script>

<script src="api.js?v=7.2"></script>

<script src="app.js?v=7.2"></script>

</body>


</html>
