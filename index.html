<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaiyu">

<title>Kaiyu Invest</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>
📈 Kaiyu Invest
</h1>



<nav>

<button onclick="showPage('home')">
🏠账户
</button>


<button onclick="showPage('valuation')">
📊估值
</button>


</nav>





<!-- 首页 -->

<div id="home" class="page">


<h2>
💰账户
</h2>


<div id="accounts"></div>


<button onclick="addAccount()">

+ 添加账户

</button>



<hr>


<h2>
🛡备用金
</h2>


<div class="card">


目标：

<input 
id="reserveTarget"
type="number"
value="12000">


<br>


当前：

<input 
id="reserveNow"
type="number"
value="0">



<button onclick="saveReserve()">

保存

</button>


</div>



</div>







<!--估值页面-->

<div id="valuation" class="page hidden">


<h2>
📊市场估值
</h2>



<div class="card">


更新时间：

<span id="updateTime">
未更新
</span>

<div class="supported-tip">
指数PE日期：<span id="peDate">等待同步</span>（交易日收盘后更新）
</div>


<br>


<button onclick="refreshData()">

刷新

</button>


</div>




<div id="markets"></div>



<button onclick="openAdd()">

+ 添加估值

</button>



</div>







<!-- 添加估值弹窗 -->


<div id="addBox" class="card hidden">


<h3>
添加估值
</h3>


名称：

<br>

<input id="nameInput" list="marketNames" placeholder="例如：标普500">

<datalist id="marketNames">
<option value="沪深300">
<option value="中证500">
<option value="中证1000">
<option value="上证50">
<option value="创业板">
<option value="科创50">
<option value="纳斯达克100">
<option value="标普500">
<option value="中证红利">
<option value="红利低波">
<option value="中证白酒">
<option value="中证银行">
<option value="黄金">
</datalist>

<div class="supported-tip">
可输入指数名称或指数代码，系统会自动匹配 PE
</div>


<button onclick="addMarket()">

保存

</button>



<button onclick="closeAdd()">

取消

</button>


</div>







<script src="data.js?v=7.6"></script>

<script src="api.js?v=7.6"></script>

<script src="app.js?v=7.6"></script>

</body>


</html>
